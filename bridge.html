<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Returning to Inventory</title>
  <style>
    body{margin:0;background:#f6f7f5;color:#17202a;font-family:Arial,sans-serif;padding:32px}
    .card{max-width:560px;margin:60px auto;background:#fff;border-top:6px solid #0B1A2E;border-radius:10px;padding:24px;box-shadow:0 10px 30px rgba(11,26,46,.12)}
    h1{color:#0B1A2E}
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Returning to Inventory…</h1>
    <p id="message">Passing the saved result back to the inventory page.</p>
  </div>
  <script>
    function decodeBalances(text){
      const balances={};
      if(!text)return balances;
      text.split('|').forEach(entry=>{
        if(!entry)return;
        const [number,a,t,o,z]=entry.split(',');
        const partId='P-'+String(Number(number)).padStart(6,'0');
        balances[partId]={available:Number(a||0),storage:Number(t||0),checkedOut:Number(o||0),unclassified:Number(z||0),unresolved:[]};
      });
      return balances;
    }

    const p=new URLSearchParams(location.search);
    const bridge=p.get('bridge')||'';
    let payload=null;

    if(bridge==='bootstrap'){
      payload={
        source:'robotics-inventory-backend',
        type:'bootstrap',
        ok:p.get('ok')==='1',
        user:{
          email:p.get('email')||'',
          firstName:p.get('firstName')||'',
          lastName:p.get('lastName')||'',
          role:p.get('role')||''
        },
        balances:decodeBalances(p.get('balances')||'')
      };
    }else if(bridge==='inventory-updated'){
      payload={
        source:'robotics-inventory-backend',
        type:'inventory-updated',
        ok:p.get('ok')==='1',
        partId:p.get('partId')||'',
        balances:{
          available:Number(p.get('available')||0),
          storage:Number(p.get('storage')||0),
          checkedOut:Number(p.get('checkedOut')||0),
          unclassified:Number(p.get('unclassified')||0),
          unresolved:[]
        },
        transactionId:p.get('transactionId')||''
      };
    }else if(bridge==='part-flag-updated'){
      payload={
        source:'robotics-inventory-backend',
        type:'part-flag-updated',
        ok:p.get('ok')==='1',
        partId:p.get('partId')||'',
        flags:{
          retired:p.get('retired')==='1',
          unavailable:p.get('unavailable')==='1',
          notInventoried:p.get('notInventoried')==='1',
          studyGuide:p.get('studyGuide')==='1'
        }
      };
    }else if(bridge==='part-flag-error'){
      payload={
        source:'robotics-inventory-backend',
        type:'part-flag-error',
        ok:false,
        partId:p.get('partId')||'',
        flag:p.get('flag')||'',
        message:p.get('message')||'Part status update failed.'
      };
    }else if(bridge==='part-image-updated'){
      payload={
        source:'robotics-inventory-backend',
        type:'part-image-updated',
        ok:p.get('ok')==='1',
        partId:p.get('partId')||'',
        imageUrl:p.get('imageUrl')||''
      };
    }else if(bridge==='part-image-error'){
      payload={
        source:'robotics-inventory-backend',
        type:'part-image-error',
        ok:false,
        partId:p.get('partId')||'',
        message:p.get('message')||'Image link update failed.'
      };
    }else if(bridge==='part-name-updated'){
      payload={
        source:'robotics-inventory-backend',
        type:'part-name-updated',
        ok:p.get('ok')==='1',
        partId:p.get('partId')||'',
        partName:p.get('partName')||''
      };
    }else if(bridge==='part-name-error'){
      payload={
        source:'robotics-inventory-backend',
        type:'part-name-error',
        ok:false,
        partId:p.get('partId')||'',
        message:p.get('message')||'Part rename failed.'
      };
    }else if(bridge==='inventory-error'){
      payload={source:'robotics-inventory-backend',type:'inventory-error',ok:false,message:p.get('message')||'Inventory update failed.'};
    }

    function persistPartFlags(data){
      if(!data||data.type!=='part-flag-updated'||!data.ok||!data.partId||!data.flags)return;
      try{
        const all=JSON.parse(localStorage.getItem('roboticsInventoryPartFlags')||'{}');
        all[data.partId]={
          retired:!!data.flags.retired,
          unavailable:!!data.flags.unavailable,
          notInventoried:!!data.flags.notInventoried
        };
        localStorage.setItem('roboticsInventoryPartFlags',JSON.stringify(all));
      }catch(e){}
      try{
        const all=JSON.parse(localStorage.getItem('roboticsInventoryStudyGuide')||'{}');
        all[data.partId]=!!data.flags.studyGuide;
        localStorage.setItem('roboticsInventoryStudyGuide',JSON.stringify(all));
      }catch(e){}
    }

    function persistPartImage(data){
      if(!data||data.type!=='part-image-updated'||!data.ok||!data.partId||!data.imageUrl)return;
      try{
        const all=JSON.parse(localStorage.getItem('roboticsInventoryImageOverrides')||'{}');
        all[data.partId]=data.imageUrl;
        localStorage.setItem('roboticsInventoryImageOverrides',JSON.stringify(all));
      }catch(e){}
    }

    function persistPartName(data){
      if(!data||data.type!=='part-name-updated'||!data.ok||!data.partId||!data.partName)return;
      try{
        const all=JSON.parse(localStorage.getItem('roboticsInventoryNameOverrides')||'{}');
        all[data.partId]=data.partName;
        localStorage.setItem('roboticsInventoryNameOverrides',JSON.stringify(all));
      }catch(e){}
    }

    function deliverPayload(data){
      if(!data)return;
      persistPartFlags(data);
      persistPartImage(data);
      persistPartName(data);
      const envelope={id:Date.now()+'-'+Math.random().toString(36).slice(2),payload:data};

      try{localStorage.setItem('roboticsInventoryBridgeEvent',JSON.stringify(envelope));}catch(e){}

      try{
        const channel=new BroadcastChannel('robotics-inventory');
        channel.postMessage(data);
        channel.close();
      }catch(e){}

      try{
        if(window.opener&&!window.opener.closed){window.opener.postMessage(data,location.origin);}
      }catch(e){}
    }

    function closeBridgeWindow(){
      try{window.close();}catch(e){}
      try{
        if(!window.closed){
          window.open('','_self');
          window.close();
        }
      }catch(e){}
    }

    if(payload){
      deliverPayload(payload);
      document.getElementById('title').textContent=payload.ok===false?'Inventory error':'Saved';
      document.getElementById('message').textContent=payload.ok===false?(payload.message||'The operation failed.'):'The inventory page has been updated.';
      closeBridgeWindow();
    }else{
      document.getElementById('title').textContent='Nothing to return';
      document.getElementById('message').textContent='No inventory result was received.';
    }
  </script>
</body>
</html>
